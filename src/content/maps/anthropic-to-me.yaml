# 把一家 AI 原生公司拆成五层，再逐层翻译成个人可执行的做法。
# 五层的拆法来自公开评论，不是 Anthropic 官方说法；组织部分均为转述。
title: 从一家 AI 原生公司，到一个人的操作框架
summary: 把 Anthropic 拆成五层（治理、安全、算力、研究、商业），逐层翻译成一个人能每天用的做法。
status: 学习中
updated: 2026-10-27
tags: [AI 原生, 超级个体, 系统思维]
note: 五层拆法来自对 Anthropic 的公开评论，不是官方说法；组织部分为转述。个人部分是我的实践草案，会边用边改。

bridge:
  - from: 信托治理
    fromNote: 用独立机制护住使命，不被短期利润带跑
    to: 个人宪法
    toNote: 一页纸写清做什么、不做什么、什么钱不赚，定期请人对照
    node: my-constitution
  - from: 安全定位
    fromNote: 能力越强，扩展的门槛越严
    to: 扩张门槛
    toNote: 新项目必须过闸，旧项目达标才准开新的
    node: my-gate
  - from: 算力大户
    fromNote: 把算力当生产资料，舍得重投
    to: 个人算力栈
    toNote: AI 订阅、Agent、仓库与记忆、定时任务，按"替我跑了多少小时"衡量
    node: my-compute
  - from: 研究文化
    fromNote: 长期实验、公开发表、先理解再规模化
    to: 实验 + 公开
    toNote: 每个项目写成实验卡，结论公开成判断
    node: my-experiment
  - from: 商业公司
    fromNote: 产品营收养前沿研究
    to: 现金流引擎
    toNote: 一个稳定赚钱的盘子养其他实验，时间和预算按比例切
    node: my-cashflow

regions:
  - id: governance
    title: 1 治理：使命怎么不跑偏
    summary: 组织靠制度护住长期目标；个人靠写下来的原则和外部的眼睛。
    nodes:
      - id: org-governance
        title: 组织怎么做：信托护使命
        summary: 设一个不以利润为目标的机构参与选董事，防止使命被短期压力冲淡。
        detail: |
          一家公司既要赚钱，又说自己有更长远的使命，最大的风险是使命在一次次"先活下来"的决定里被悄悄放弃。

          Anthropic 的做法是在公司结构上加一层：注册为公益公司，并设立一个长期利益信托，逐步参与选任董事会成员。意思是：使命不是靠创始人的自觉，而是写进了制度。
        points:
          - 使命写进结构，而不是只写在宣传里
          - 让一个不受短期利益驱动的角色有发言权
        related: [my-constitution]
      - id: my-constitution
        title: 我怎么做：一页纸个人宪法
        summary: 把长期原则、不做清单、不赚的钱写下来，每个大决定先拿它对一遍。
        detail: |
          个人没有董事会，但同样会在"这个机会也不错"里慢慢跑偏。对策是把原则写在明处，并且让别人能拿着它来问你。

          一页纸就够：我长期要成为什么样的人、我把时间投在哪里、哪些事和钱我不碰。再找一两位信得过的人当"信托人"，每季度拿这页纸对照我的实际选择。
        points:
          - 一页纸，能贴在每天看得到的地方
          - 写"不做清单"比写目标更有用
          - 每季度请外部的人对照一次
        related: [org-governance, my-gate]
        questions:
          - 帮我把我最近三个决定，逐条对照我的个人宪法，哪里不一致？
      - id: check-governance
        title: 小心：写完就放着
        summary: 宪法的价值只在被拿出来对照的那一刻，不在写得多漂亮。
        detail: |
          最常见的失败是：花一晚上写得很好，然后再也没打开过。判断它是否在起作用，只看一件事：最近一次说"不"，是不是因为它。
        related: [my-constitution]

  - id: safety
    title: 2 安全：能力越大，门槛越严
    summary: 组织按风险等级加约束；个人按精力上限设闸门。
    nodes:
      - id: org-safety
        title: 组织怎么做：负责任扩展
        summary: 先定好"能力到什么程度，必须先有什么防护"，达不到就不往前推。
        detail: |
          Anthropic 公开了一套负责任扩展政策：按模型能力分级，每升一级都要求先具备相应的安全措施，否则就暂停扩展。

          这里的关键不是"安全"二字，而是先定规则、再做扩张——门槛在诱惑出现之前就已经写好了。
        points:
          - 规则先于扩张
          - 用分级代替一刀切
        related: [my-gate]
      - id: my-gate
        title: 我怎么做：扩张门槛
        summary: 同时"在跑"的项目设上限；新项目要进来，先有一个旧项目达标或冻结。
        detail: |
          一个人最容易犯的错，不是不够努力，而是同时开的口子太多：每个想法都启动了，没有一个被推到能自己转。

          门槛的做法很简单：给"在跑"的项目设一个上限（比如 3 个），其余标成"冻结"；新想法只能先进想法池；想把它拉进来，必须先让一个在跑的项目达到它的标准，或者主动冻结一个。

          担责也在这一层：我答应别人的交付，就是我的信任资产，门槛保护的正是它。
        points:
          - 在跑项目设上限
          - 新想法先进想法池，不直接启动
          - 进一个，就要先出一个
        related: [my-cashflow, check-safety]
        questions:
          - 按"在跑 / 冻结 / 想法池"三档，帮我给现在手上的事分一次档。
      - id: check-safety
        title: 小心：把冻结当失败
        summary: 冻结不是放弃，是把注意力还给能转起来的那几个。
        detail: |
          冻结的项目照样保留记录和出口，条件满足时可以解冻。真正的失败是十个项目都做到三成。
        related: [my-gate]

  - id: compute
    title: 3 算力：杠杆是生产资料
    summary: 组织重投算力；个人把 AI 当成会干活的生产资料，而不是聊天工具。
    nodes:
      - id: org-compute
        title: 组织怎么做：算力是命脉
        summary: 前沿模型的训练和服务都要海量算力，长期锁定算力是战略决定。
        detail: |
          对一家前沿 AI 公司来说，算力不是成本项，而是能力的上限。能用多少算力，基本决定了能做出多强的模型、能服务多少用户。
        points:
          - 算力决定能力上限
          - 提前布局，而不是临时采购
        related: [my-compute]
      - id: my-compute
        title: 我怎么做：个人算力栈
        summary: AI 订阅、Agent、仓库与记忆、定时任务，组成一套替我干活的系统。
        detail: |
          个人的"算力"由几层组成：能用的模型和订阅；能跑任务的 Agent；让 AI 接得住上下文的仓库和记忆；不用我盯着也能自己运行的定时任务。

          衡量它的不是用了多少工具，而是：这一周，AI 替我跑了多少小时我原本要亲手做的事。
        points:
          - 工具会换，系统要留下
          - 指标：AI 每周替我跑了多少小时
          - 技巧只学不囤，沉淀的是流程
        related: [org-compute, check-compute]
        questions:
          - 我这周手动重复做了哪些事，哪些可以交给 Agent 或定时任务？
      - id: check-compute
        title: 小心：最贵的算力是注意力
        summary: 工具越多，切换越多；一个人真正稀缺的是注意力。
        detail: |
          组织缺的是芯片，个人缺的是注意力。装上十个工具、每个都要盯着，等于把算力全耗在调度上。好的算力栈应该让我更少地被打断。
        related: [my-compute, my-gate]

  - id: research
    title: 4 研究：先理解，再放大
    summary: 组织靠长期研究和公开发表；个人把每个项目当实验，把结论公开。
    nodes:
      - id: org-research
        title: 组织怎么做：研究机构的文化
        summary: 做可解释性等长期研究，公开论文和做法，用证据更新判断。
        detail: |
          Anthropic 有很强的研究机构气质：研究模型内部在发生什么，公开发表方法和发现，并按证据调整自己的方向，而不是按信念。
        points:
          - 长期问题需要耐心
          - 公开让结论接受检验
        related: [my-experiment]
      - id: my-experiment
        title: 我怎么做：实验卡 + 公开判断
        summary: 每个项目开工前写下假设、指标、截止日；结束时写结论，公开成一条判断。
        detail: |
          把"做项目"换成"做实验"：开工前先写一张卡——我在验证什么假设、用什么指标判断、什么时候必须给结论。

          到期不管成败都写结论。值得分享的，脱敏后变成网站上的一条判断。这样即使项目没成，判断也留下了。
        points:
          - 假设、指标、截止日，三样缺一不可
          - 到期必须下结论：继续、调整或停止
          - 公开输出倒逼想清楚
        related: [org-research, my-gate]
        questions:
          - 帮我把手上一个项目改写成一张实验卡：假设、指标、截止日。
      - id: check-research
        title: 小心：只研究不交付
        summary: 研究是为了更好地交付，不能变成拖延的理由。
        detail: |
          想得深是优势，但实验卡的截止日就是用来防止"再想想"的。到期没有结论，本身就是一个结论。
        related: [my-experiment]

  - id: business
    title: 5 商业：现金流养探索
    summary: 组织靠产品营收养研究；个人靠一个稳定的盘子养其他实验。
    nodes:
      - id: org-business
        title: 组织怎么做：营收养研究
        summary: 卖模型和产品带来营收，营收再投入下一代研究和算力。
        detail: |
          研究、安全、算力都很花钱。没有商业收入，前面四层都撑不久。商业不是使命的对立面，而是使命的燃料。
        points:
          - 商业是燃料，不是对立面
          - 营收回流到研究和算力
        related: [my-cashflow]
      - id: my-cashflow
        title: 我怎么做：现金流引擎 + 预算切分
        summary: 指定一个稳定赚钱的盘子当引擎，时间和预算按比例切给引擎、实验和学习。
        detail: |
          先认清哪个业务是现金流引擎，优先保它；其他都是实验，用引擎赚来的钱和时间去养。

          我的时间草案：现金流约 60%、实验约 25%、学习与记录约 15%。比例好定，守住难，所以每周回看一次实际花在哪。
        points:
          - 先保引擎，再谈探索
          - 时间按比例切，每周回看
          - 实验预算花完就停，不吃老本
        related: [my-gate, org-business]
        questions:
          - 按我上周的实际时间，算算现金流、实验、学习各占了多少？

  - id: loop
    title: 串起来：五层是一个飞轮
    summary: 原则定方向，门槛控风险，算力放大产出，实验产生新判断，现金流再买算力、养实验。
    nodes:
      - id: flywheel
        title: 飞轮，而不是清单
        summary: 传统路径是学技能、卖时间；这里是拥有一个自己会转的循环。
        detail: |
          五层不是五件并列的事，而是一个循环：宪法决定往哪转，门槛决定一次转几个，算力决定转多快，实验决定转出什么新东西，现金流决定能不能一直转下去。

          传统的路是学一项技能，然后找工作或创业，本质是卖时间。AI 原生的个人，目标是拥有这样一个循环，让系统而不只是自己在产出。
        points:
          - 原则 → 门槛 → 算力 → 实验 → 现金流 → 再投入
          - 缺最弱的那一层，飞轮就转不起来
        related: [my-constitution, my-cashflow]
      - id: dont-copy
        title: 别照搬：个人没有那么多资本
        summary: 公司的底气是顶尖人才和巨额资本，个人要找的是这五层的"小号版本"。
        detail: |
          照搬组织架构，很容易把框架本身变成又一个想得很深的新项目。它的用法是：每次觉得乱，就问一句"现在最弱的是哪一层"，只补那一层。
        related: [flywheel, check-governance]
