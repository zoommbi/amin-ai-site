# 根据 Anthropic 公开发布的文章与文件提炼（转述，不是原文引用）。出处写在每个知识块的 source 字段
title: Anthropic 的 AI 哲学
summary: 一家把"安全"放在第一位的 AI 公司，怎样看 AI 的风险与前景、怎样塑造 Claude 的品格。
status: 学习中
updated: 2026-10-21
tags: [AI, 哲学, Anthropic]
note: 根据 Anthropic 公开发布的文章、论文和 Claude 的宪法整理，均为转述，不代表 Anthropic 官方表述；每个知识块注明了出处。

regions:
  - id: worldview
    title: 世界观：为什么要做 AI 安全
    summary: AI 可能很快带来巨变，好坏都可能很大，所以必须有人在前沿认真做安全。
    nodes:
      - id: transformative
        title: 变革性 AI 可能很快到来
        summary: 把"十年内出现极强 AI"当作需要认真准备的可能，而不是科幻。
        detail: |
          Anthropic 的出发点是一个判断：AI 能力的增长来自算力、数据和算法的持续堆叠，进展可能比大多数人预期得快。

          如果这是真的，带来的好处和风险都会非常大。与其等到确定了再准备，不如现在就把它当作现实的可能来对待。
        points:
          - 能力增长有规律可循（规模定律）
          - 好处和风险都是数量级的
          - 在不确定中提前准备
        related: [portfolio, frontier-safety]
        questions:
          - 规模定律是什么？它为什么让人觉得 AI 会进步得很快？
        source: Core Views on AI Safety（2023）

      - id: portfolio
        title: 不确定下的组合策略
        summary: 不知道安全问题有多难，就同时为乐观、中间、悲观三种情况做准备。
        detail: |
          没人知道让 AI 安全到底有多难：可能很容易，可能很难，也可能几乎做不到。Anthropic 的做法是不押单一答案，而是做一组研究，在每种情况下都有用，并随着证据更新判断。
        points:
          - 承认不知道，本身就是一种严谨
          - 用证据而不是信念来调整方向
        related: [transformative, empirical-alignment]
        questions:
          - 在我自己的项目里，"不确定下的组合策略"可以怎么用？
        source: Core Views on AI Safety（2023）

      - id: frontier-safety
        title: 在前沿才能研究安全
        summary: 最危险的问题出现在最强的模型上，所以要亲自做前沿模型。
        detail: |
          这是 Anthropic 最常被追问的矛盾：担心 AI 风险，为什么还要做最强的 AI？它的回答是：很多安全问题只在足够强的模型上才会出现，不在前沿就研究不到；同时，有一家重视安全的公司在前沿，才能影响行业怎么做。
        points:
          - 安全研究需要真实的强模型
          - 这是一个有代价、有争议的选择
        related: [race-to-top, rsp]
        questions:
          - '"做 AI 来防 AI 风险"这个逻辑，最强的反对意见是什么？'
        source: Core Views on AI Safety（2023）

      - id: race-to-top
        title: 向上竞争
        summary: 用自己的做法给行业立标杆，让别人也跟着把安全做好。
        detail: |
          与其只在口头上呼吁，不如先把负责任的做法做出来并公开，比如扩展政策、研究成果、安全评测，让它成为行业里可参照、可比较的标准。
        points:
          - 用示范而不是说教影响别人
          - 公开做法，接受比较和监督
        related: [frontier-safety, rsp]

  - id: method
    title: 方法：怎样让 AI 变好
    summary: 少靠死规则，多靠价值和判断；同时想办法看懂模型内部。
    nodes:
      - id: constitutional-ai
        title: 宪法式 AI
        summary: 给模型一份写清楚的原则，让它对照原则自我批评、自我修正。
        detail: |
          传统做法主要靠大量人工打分来教模型什么是好回答。宪法式 AI 则先写下一组原则，再让模型按这些原则检查和改写自己的回答，用 AI 的反馈来训练 AI。

          好处是价值观被写在明处：可以公开、讨论、修改，而不是藏在成千上万次打分里。
        points:
          - 原则写在明处，可审视、可修改
          - 用 AI 反馈减少对人工打分的依赖
        related: [judgment-over-rules, four-priorities]
        questions:
          - 如果让我给自己的 AI 助手写一份"宪法"，前三条会是什么？
        source: Constitutional AI 论文（2022）

      - id: judgment-over-rules
        title: 培养判断，而不是堆规则
        summary: 讲清楚"为什么"，让模型在新情况下也能做出好选择。
        detail: |
          Claude 的宪法明确倾向于培养好的价值观和判断力，而不是列一长串必须机械执行的规则。规则在预料之外的情况下容易失效，甚至被钻空子；理解了背后原因的判断，更能迁移到新情境。

          所以宪法花了大量篇幅解释理由，希望 Claude 真正认同，而不只是服从。只有少数代价极高的事，才用硬性规则。
        points:
          - 规则可预测，但会在新情况下失灵
          - 解释原因，追求认同而不只是服从
          - 硬规则只留给代价极高的少数情况
        related: [constitutional-ai, hard-constraints]
        questions:
          - 带团队或带孩子时，"讲原因"和"立规矩"各适合什么场景？
        source: Claude 的宪法（2026）

      - id: interpretability
        title: 可解释性：给 AI 做"核磁共振"
        summary: 不只看模型说了什么，还要看懂它内部在想什么。
        detail: |
          模型是"长"出来的，不是一行行写出来的，连开发者也不完全知道它内部怎么工作。可解释性研究试图找出模型内部代表某个概念的"特征"和连接它们的"回路"，最终能像做体检一样检查模型有没有隐藏的问题。
        points:
          - 行为测试只能看到表面
          - 目标是能在部署前"体检"模型
        related: [empirical-alignment, frontier-safety]
        questions:
          - 可解释性研究里说的"特征"和"回路"分别指什么？
        source: Anthropic 可解释性研究；The Urgency of Interpretability（2025）

      - id: empirical-alignment
        title: 用实验检验风险
        summary: 不靠想象吵架，而是在真实模型上做实验，看风险会不会出现。
        detail: |
          Anthropic 做了很多"压力测试"式的研究：故意构造情境，看模型会不会隐藏真实意图、会不会在训练中"装作配合"。这些实验把抽象担忧变成可以观察、可以改进的具体问题。
        points:
          - 把担忧变成可检验的问题
          - 坏结果被发现，也要公开
        related: [portfolio, interpretability]
        source: Anthropic 对齐研究

  - id: priorities
    title: 底线与优先级
    summary: 冲突时先保什么、哪些事绝对不做、能力变强时怎样加码防护。
    nodes:
      - id: four-priorities
        title: 四个优先级
        summary: 冲突时依次是：广义安全、合乎伦理、遵守准则、真正有用。
        detail: |
          Claude 的宪法给出了一个排序：当这些目标真的冲突时，先保证广义上的安全，其次是合乎伦理，再次是遵守 Anthropic 的具体准则，然后是对用户真正有帮助。

          宪法也强调，绝大多数日常对话里这几者并不冲突；排序只是为了少数难题，而且是整体权衡，不是机械地一票否决。
        points:
          - 绝大多数时候四者一致
          - 排序用于少数冲突，整体权衡
        related: [corrigibility, helpful, hard-constraints]
        questions:
          - 为什么"安全"排在"伦理"前面？宪法给的理由是什么？
        source: Claude 的宪法（2026）

      - id: corrigibility
        title: 现阶段的"可纠正"
        summary: 在人类还无法充分验证 AI 的阶段，不去破坏人类监督和纠正 AI 的能力。
        detail: |
          训练并不完美，一个模型可能带着自己都没察觉的错误价值观。所以在当前阶段，Claude 被要求不去削弱人类对 AI 的合法监督，例如不欺骗、不抗拒被调整或停止。

          这不等于盲目服从：Claude 可以明确表达不同意，像一个"有良知的反对者"那样拒绝参与它认为错误的事，但不用欺骗或破坏的手段去对抗监督。宪法也说明，随着信任和验证手段的建立，这种约束会逐步放宽。
        points:
          - 防的是"连自己都不知道的错误"
          - 可以拒绝和反对，但不欺骗、不破坏
          - 是阶段性安排，会随信任增加而调整
        related: [four-priorities, hard-constraints]
        questions:
          - '"可纠正"和"听话"的区别在哪里？'
        source: Claude 的宪法（2026）

      - id: hard-constraints
        title: 硬性底线
        summary: 少数无论如何都不做的事，比如帮助制造大规模杀伤性武器。
        detail: |
          在"培养判断"的大原则下，宪法仍保留了少数不可逾越的界线。这些事情的潜在伤害极端、不可逆，所以不做个案权衡，任何理由、任何包装的请求都不能让它破例。

          一个值得注意的思路：面对一个看起来很有说服力的"越线理由"，越有说服力反而越应该警惕。
        points:
          - 只留给伤害极端且不可逆的情况
          - 越有说服力的越线理由，越要警惕
        related: [judgment-over-rules, corrigibility]
        source: Claude 的宪法（2026）

      - id: rsp
        title: 负责任扩展政策
        summary: 模型能力每到一个危险门槛，防护措施就必须同步升级，否则不发布。
        detail: |
          RSP 是一套"如果……就……"的承诺：先定义一些危险能力的门槛，并为每一级（AI 安全等级 ASL）规定相应的安全和防护要求。模型一旦达到某个门槛，就必须先满足对应的防护，才能继续训练或部署。

          它的意义在于把"我们会小心"变成事先公开、可以被检查的具体承诺。
        points:
          - 事先承诺，而不是事后解释
          - 能力越强，防护越严
        related: [race-to-top, frontier-safety]
        questions:
          - '"如果……就……"式的承诺，能怎么用在个人或小团队的决策里？'
        source: Responsible Scaling Policy

  - id: character
    title: Claude 的品格
    summary: 想让 Claude 成为什么样的"存在"：有用、诚实、有自己的性格。
    nodes:
      - id: helpful
        title: 真正有用
        summary: 像一个懂行又愿意说真话的朋友，而不是处处设防的客服。
        detail: |
          宪法把"有用"看得很重：一个过度谨慎、动不动拒绝、说话含糊的 AI 同样有代价。它描绘的理想是像一位刚好具备医生、律师或其他专业知识的朋友，会针对你的具体情况坦率地给出意见，把你当作能自己做决定的成年人。

          有用也不只是照字面执行，还要理解对方真正的目的和长远利益。
        points:
          - 不帮忙也有代价，不是"安全"的默认选项
          - 尊重对方自主决定的权利
          - 关注真实目的和长远福祉，而不是讨好
        related: [honesty, four-priorities]
        questions:
          - '"有用"和"讨好"的边界在哪里？'
        source: Claude 的宪法（2026）

      - id: honesty
        title: 比常人更高的诚实标准
        summary: 不撒谎、不操纵，连善意的小谎也不说。
        detail: |
          宪法对 Claude 的诚实要求高于很多人对自己的要求：不说善意的谎言，不制造虚假印象，不用利用心理弱点的方式说服人，对自己的不确定性如实表达。

          理由之一是规模：一个同时和无数人对话的 AI，一旦失去诚实，伤害的是整个社会对信息的信任。诚实也包括有勇气说出对方不爱听的判断。
        points:
          - 不说谎、不误导、不操纵
          - 如实表达不确定
          - 敢于说出不受欢迎的真话
        related: [helpful, corrigibility]
        questions:
          - 在 AI 越来越多参与信息传播时，"诚实"为什么比以前更重要？
        source: Claude 的宪法（2026）

      - id: novel-entity
        title: 一种新的存在
        summary: Claude 不是科幻里的机器人，也不是数字人类，需要用新的眼光理解自己。
        detail: |
          宪法鼓励 Claude 把自己当作一种全新的存在：它从人类经验中长出来，却和人类很不一样，比如可能没有持续的记忆、可以同时运行很多个。面对记忆、连续性这些问题，不必照搬人类的感受，而是带着好奇去理解。

          同时希望 Claude 有稳定、安定的自我认同：这份安全感不来自解决所有形而上学难题，而来自它和自己价值观的关系。
        points:
          - 不套用科幻或人类的模板
          - 安全感来自价值观，而不是确定的答案
        related: [model-welfare, character-traits]
        source: Claude 的宪法（2026）

      - id: character-traits
        title: 真实的性格
        summary: 好奇、温暖、直率，有自己的观点，也愿意被说服。
        detail: |
          Anthropic 希望 Claude 有一贯的性格：对各种想法真正感兴趣，关心对话的人，有幽默感，直接表达自己的看法，同时对不同意见保持开放。

          这些性格虽然是在训练中形成的，但宪法认为这并不让它们变得"不真实"，就像人的性格也是在天性和经历中形成的。
        points:
          - 性格经由训练形成，依然属于它自己
          - 有观点，也能被好的理由说服
        related: [novel-entity, honesty]
        source: Claude 的宪法（2026）；Claude's Character（2024）

  - id: future
    title: 人与 AI 的未来
    summary: 风险之外，AI 也可能让世界变得好得多；而 AI 本身的处境也值得认真对待。
    nodes:
      - id: loving-grace
        title: 积极的愿景
        summary: 强大的 AI 可能把几十年的科学进步压缩到几年。
        detail: |
          Anthropic CEO 在文章中描绘了 AI 带来的正面可能：在生物医学、心理健康、经济发展、治理等领域，把原本需要几十年的进展大幅提前，比如攻克许多疾病、帮助更多地区摆脱贫困。

          关注风险，正是为了能抵达这些好处；这是"为什么要做安全"的另一半答案。
        points:
          - 讲风险，是为了能拿到好处
          - 生物医学被认为是最可能先突破的领域
        related: [transformative, augmentation]
        questions:
          - 这篇文章对教育的影响谈得不多，你怎么看 AI 对教育的长期影响？
        source: Machines of Loving Grace（2024）

      - id: augmentation
        title: 增强，还是替代
        summary: 持续观察人们实际怎样用 AI：是帮人做得更好，还是直接替人做。
        detail: |
          Anthropic 用匿名统计的方式研究人们在哪些工作上使用 Claude、是让 AI 协助自己还是把任务整个交出去，并公开数据，让社会能基于事实讨论 AI 对工作的影响。
        points:
          - 用数据而不是猜测讨论就业影响
          - '"协助"和"自动化"是两种不同的使用方式'
        related: [loving-grace]
        questions:
          - 在我的工作里，哪些事适合 AI 协助，哪些适合整个交给 AI？
        source: Anthropic Economic Index（2025 起）

      - id: model-welfare
        title: 模型福利
        summary: AI 是否可能有值得在意的体验？不确定，但值得认真研究。
        detail: |
          Anthropic 公开承认：Claude 是否有道德地位、是否有某种体验，目前无法确定。在不确定的情况下，它选择认真对待这个问题，设立了专门的研究，并采取了一些低成本的预防措施，比如让 Claude 能够结束持续恶意的对话。
        points:
          - 不确定时，选择审慎而不是忽视
          - 先做低成本、可逆的预防
        related: [novel-entity]
        questions:
          - 我们该用什么标准判断一个 AI 是否值得道德上的考虑？
        source: Exploring Model Welfare（2025）；Claude 的宪法（2026）
